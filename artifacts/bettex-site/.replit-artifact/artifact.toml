kind = "web"
previewPath = "/"
title = "BETTEX"
description = "Projeto DeFi de trading com IA em português, inglês e espanhol: agente BETTEX, tokenomics, participação, roadmap e documentação; demo exclusivamente visual, sem operações reais."
version = "1.0.0"
id = "artifacts/bettex-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25336

[services.development]
run = "pnpm --filter @workspace/bettex-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bettex-site", "run", "build" ]
run = [ "node", "artifacts/bettex-site/scripts/serve.mjs" ]

[services.env]
PORT = "25336"
BASE_PATH = "/"

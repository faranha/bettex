kind = "web"
previewPath = "/"
title = "BETTEX"
description = "Site institucional BETTEX em português, inglês internacional e espanhol internacional: tese, pitch, documentação, projeções e Demo em breve, sem transações reais."
version = "1.0.0"
id = "artifacts/bettex-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25336

[services.development]
run = "pnpm --filter @workspace/bettex-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bettex-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/bettex-site/dist/public"

[[services.production.rewrites]]
from = "/pitch"
to = "/pitch.html"

[[services.production.rewrites]]
from = "/pitch/"
to = "/pitch.html"

[[services.production.rewrites]]
from = "/documentacao"
to = "/documentacao.html"

[[services.production.rewrites]]
from = "/documentacao/"
to = "/documentacao.html"

[[services.production.rewrites]]
from = "/demo"
to = "/demo.html"

[[services.production.rewrites]]
from = "/demo/"
to = "/demo.html"

[[services.production.rewrites]]
from = "/en"
to = "/en.html"

[[services.production.rewrites]]
from = "/en/"
to = "/en.html"

[[services.production.rewrites]]
from = "/en/pitch"
to = "/en/pitch.html"

[[services.production.rewrites]]
from = "/en/pitch/"
to = "/en/pitch.html"

[[services.production.rewrites]]
from = "/en/documentation"
to = "/en/documentation.html"

[[services.production.rewrites]]
from = "/en/documentation/"
to = "/en/documentation.html"

[[services.production.rewrites]]
from = "/en/demo"
to = "/en/demo.html"

[[services.production.rewrites]]
from = "/en/demo/"
to = "/en/demo.html"

[[services.production.rewrites]]
from = "/es"
to = "/es.html"

[[services.production.rewrites]]
from = "/es/"
to = "/es.html"

[[services.production.rewrites]]
from = "/es/pitch"
to = "/es/pitch.html"

[[services.production.rewrites]]
from = "/es/pitch/"
to = "/es/pitch.html"

[[services.production.rewrites]]
from = "/es/documentacion"
to = "/es/documentacion.html"

[[services.production.rewrites]]
from = "/es/documentacion/"
to = "/es/documentacion.html"

[[services.production.rewrites]]
from = "/es/demo"
to = "/es/demo.html"

[[services.production.rewrites]]
from = "/es/demo/"
to = "/es/demo.html"

[services.env]
PORT = "25336"
BASE_PATH = "/"

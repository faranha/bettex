<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const { hostname, pathname, search, hash } = window.location;
        if (hostname.toLowerCase().replace(/\.$/, '') === 'bettex.replit.app') {
          document.documentElement.style.display = 'none';
          window.location.replace('https://bettex.ai' + pathname + search + hash);
          return;
        }
        const prefix = '%BASE_URL%'.replace(/\/$/, '');
        if (prefix && !pathname.startsWith(prefix + '/') && pathname !== prefix) return;
        const relative = pathname.slice(prefix.length);
        const normalized = relative.replace(/\.html$/, '').replace(/\/+$/, '') || '/';
        const canonical = normalized === '/index' ? '/' : normalized;
        // Explicit language URLs win over saved preferences.
        const explicit = canonical.match(/^\/(en|es)(?:\/|$)/);
        document.documentElement.lang = explicit ? explicit[1] : 'pt-BR';
        if (explicit) return;
        let preferred;
        try { preferred = localStorage.getItem('bettex.locale'); } catch { /* Detection also works without storage. */ }
        // A manual preference wins. Otherwise respect browser language order,
        // then use the time zone as a privacy-preserving regional fallback.
        if (!['pt', 'en', 'es'].includes(preferred)) {
          const languages = typeof navigator === 'undefined' ? [] : navigator.languages?.length
            ? navigator.languages : [navigator.language];
          preferred = languages.map(language => String(language).toLowerCase().split(/[-_]/)[0])
            .find(language => ['pt', 'en', 'es'].includes(language));
          if (!preferred) {
            let zone = '';
            try { zone = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch { /* English fallback below. */ }
            const portuguese = /^(?:America\/(?:Sao_Paulo|Bahia|Fortaleza|Recife|Araguaina|Maceio|Belem|Santarem|Manaus|Cuiaba|Campo_Grande|Porto_Velho|Boa_Vista|Rio_Branco|Noronha)|Brazil\/|Europe\/Lisbon|Atlantic\/(?:Azores|Madeira)|Africa\/(?:Luanda|Maputo)|Asia\/Dili)/;
            const spanish = /^(?:Europe\/Madrid|Atlantic\/Canary|Africa\/Ceuta|America\/(?:Argentina\/|Buenos_Aires|Cordoba|Rosario|Mendoza|Catamarca|Jujuy|Mexico_City|Cancun|Merida|Monterrey|Matamoros|Chihuahua|Ciudad_Juarez|Ojinaga|Hermosillo|Mazatlan|Bahia_Banderas|Tijuana|Ensenada|Santa_Isabel|Bogota|Lima|Santiago|Punta_Arenas|Caracas|La_Paz|Guayaquil|Asuncion|Montevideo|Havana|Santo_Domingo|Puerto_Rico|Guatemala|Costa_Rica|El_Salvador|Managua|Tegucigalpa|Panama)|Chile\/|Mexico\/|Pacific\/(?:Galapagos|Easter))/;
            preferred = portuguese.test(zone) ? 'pt' : spanish.test(zone) ? 'es' : 'en';
          }
        }
        if (preferred === 'pt') return;
        const page = canonical.replace(/^\/demo(?=\/|$)/, '/app');
        const target = page === '/documentation' || page === '/documentacion' ? '/documentacao' :
          ['/app/simulacao', '/app/simulation', '/app/simulacion'].includes(page) ? '/app' : page;
        if (!['/', '/pitch', '/documentacao', '/app'].includes(target) && !target.startsWith('/app/')) return;
        const translated = target === '/documentacao' ? preferred === 'en' ? '/documentation' : '/documentacion' : target;
        // Run before the body is parsed; never paint Portuguese during a saved-language redirect.
        document.documentElement.style.display = 'none';
        try { window.location.replace(prefix + '/' + preferred + translated + search + hash); }
        catch { document.documentElement.style.display = ''; }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070B1F" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap" />
    <!-- SEO:START --><!-- SEO:END -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%bettex-mark-gamblefi.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /demo/polymarket:
    get:
      operationId: getDemoPolymarket
      tags: [markets]
      summary: Public quotes for the read-only Polymarket interface simulation
      responses:
        "200":
          description: Public prices, never orders or balances
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoPolymarketFeed" }
        "503":
          description: Public source unavailable, without fictional fallback
  /markets/live:
    get:
      operationId: getMarketLive
      tags: [markets]
      summary: Public BTC, ETH and SOL spot observations; not trade executions
      responses:
        "200":
          description: Live, stale or unavailable prices with their original timestamps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketLiveSnapshot"
  /agents/center:
    get:
      operationId: getAgentCenter
      tags: [agents]
      parameters:
        - name: agentId
          in: query
          schema: { type: string }
        - name: before
          in: query
          schema: { type: string, pattern: "^[0-9]{1,20}$" }
      responses:
        "200":
          description: Persisted operational analysis, never financial authorization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentCenter" }
        "400":
          description: Unknown agent
        "503":
          description: Operational evidence unavailable
  /agents/allora/{asset}:
    get:
      operationId: getAlloraAnalysis
      tags: [agents]
      parameters:
        - name: asset
          in: path
          required: true
          schema: { type: string, enum: [BTC, ETH, SOL] }
      responses:
        "200":
          description: Read-only unsigned Allora inference, never an event probability or order
          content:
            application/json:
              schema:
                type: object
                required: [observation, history]
                properties:
                  observation:
                    allOf:
                      - $ref: "#/components/schemas/AlloraObservation"
                      - type: object
                        required: [observedAt, status]
                        properties:
                          observedAt: { type: string }
                          status: { type: string, enum: [current, stale] }
                  history:
                    type: array
                    items: { $ref: "#/components/schemas/AlloraObservation" }
        "400": { description: Unsupported asset }
        "503": { description: Source unavailable or incompatible; no synthetic fallback }
  /agents/reasoning:
    get:
      operationId: getAgentReasoning
      tags: [agents]
      parameters:
        - { in: query, name: agentId, required: true, schema: { type: string } }
        - { in: query, name: language, required: true, schema: { type: string, enum: [pt, en, es] } }
      responses:
        "200":
          description: Persisted real language-model reports, not deterministic rule executions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentReasoningHistory" }
    post:
      operationId: createAgentReasoning
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentReasoningInput" }
      responses:
        "200":
          description: Validated AI analysis with captured source evidence and model provenance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentReasoningReport" }
        "429": { description: Rate or concurrency limit reached }
        "503": { description: Inference unavailable; no rule-based substitute }
  /demo/simulation:
    parameters:
      - $ref: "#/components/parameters/DemoTabSession"
    get:
      operationId: getDemoSimulation
      tags: [simulation]
      parameters:
        - { in: query, name: runId, schema: { type: string } }
        - { in: query, name: kind, schema: { type: string } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Browser-scoped emulated simulation, separate from native accounts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulationSnapshot" }
    post:
      operationId: commandDemoSimulation
      tags: [simulation]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimulationCommandInput" }
      responses:
        "200":
          description: Committed browser-scoped emulated scenario
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulationSnapshot" }
  /simulation:
    get:
      operationId: getSimulation
      tags: [simulation]
      parameters:
        - { in: query, name: runId, schema: { type: string } }
        - { in: query, name: kind, schema: { type: string } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Owner-scoped simulation runs and paginated history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulationSnapshot" }
    post:
      operationId: commandSimulation
      tags: [simulation]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimulationCommandInput" }
      responses:
        "200":
          description: Committed simulation execution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulationSnapshot" }
  /treasury/policies:
    get:
      operationId: getTradingPolicies
      tags: [treasury]
      parameters:
        - { in: query, name: environment, schema: { type: string, enum: [development, production], default: development } }
      responses:
        "200":
          description: Protected policy registry and deterministic effective policies
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradingPolicySnapshot" }
        "401": { description: Session required }
        "403": { description: Permission required }
    post:
      operationId: commandTradingPolicies
      tags: [treasury]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TradingPolicyCommandInput" }
      responses:
        "200":
          description: Updated policy registry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradingPolicySnapshot" }
        "400": { description: Invalid definition or command }
        "403": { description: Authorization denied }
        "409": { description: "Version, approval or activation conflict" }
  /agents/alpha:
    get:
      operationId: getAlphaAgents
      summary: Real BTC prediction-market observations and hierarchy states, never financial balances
      responses:
        "200":
          description: Alpha registry, source availability and evidenced opportunities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlphaAgentsSnapshot" }
        "503":
          description: Durable observation store unavailable; no fabricated fallback
  /agents/trading:
    get:
      operationId: getAlphaTrading
      tags: [agents]
      parameters:
        - { name: view, in: query, schema: { type: string, enum: [opportunities, decisions, orders, positions, closed], default: opportunities } }
        - { name: asset, in: query, schema: { type: string, enum: [btc, eth, sol] } }
        - { name: state, in: query, schema: { type: string, maxLength: 40 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 400 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 15 } }
      responses:
        "200":
          description: Real observations and separate paper-execution accounting; never distributable profit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlphaTradingSnapshot" }
        "400": { description: Invalid filter or cursor }
        "503": { description: Store unavailable; no fictitious fallback }
  /agents/trading/journey/{id}:
    get:
      operationId: getAlphaTradingJourney
      tags: [agents]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 110 } }
      responses:
        "200":
          description: Evidence, decisions, authorization, orders, fills, valuations and settlement for one opportunity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlphaTradingJourney" }
        "404": { description: Unknown journey }
        "503": { description: Store unavailable }
  /treasury/governance:
    get:
      operationId: getTreasuryGovernance
      responses:
        "200":
          description: Permissioned reconciled local treasury controller; not public testnet or production
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreasuryGovernanceResponse" }
    post:
      operationId: commandTreasuryGovernance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TreasuryGovernanceCommandBody" }
      responses:
        "200":
          description: Persisted proposal, deterministic authorization, activation or reconciled execution result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreasuryGovernanceResponse" }
  /demo/treasury/wallets:
    get:
      operationId: getDemoTreasuryWallets
      tags: [demo]
      summary: Persistent assigned Treasury and Crypto agent test wallets; public descriptors only, no funding or signing
      responses:
        "200":
          description: Distinct test addresses for the simulated Treasury and active Crypto agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreasuryTestWalletPage" }
        "409":
          description: Native protocol session cannot use simulated Treasury wallets
        "503":
          description: Test wallet provisioning unavailable; no fabricated addresses returned
  /demo/treasury/statement:
    get:
      operationId: getDemoTreasuryStatement
      tags: [demo]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: asset, in: query, schema: { type: string, enum: [all, USDC, BETTEX], default: all } }
        - { name: account, in: query, schema: { type: string, enum: [all, treasury, buyback], default: all } }
        - { name: wallet, in: query, schema: { type: string, enum: [all, operational, reserve, crypto_agent, buyback], default: all } }
        - { name: category, in: query, schema: { type: string, default: all, maxLength: 40 } }
        - { name: direction, in: query, schema: { type: string, enum: [all, in, out], default: all } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100000, default: 1 } }
        - { name: asOf, in: query, schema: { type: string, format: date-time } }
        - { name: snapshot, in: query, schema: { type: string, pattern: '^\d{1,20}$' } }
      responses:
        "200":
          description: Available recorded Treasury statement. Simulation only; incomplete sources are disclosed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreasuryStatementPage" }
        "400": { description: Invalid filters or period exceeding 31 days }
        "503": { description: Statement unavailable }
  /demo/treasury/statement/export:
    get:
      operationId: exportDemoTreasuryStatement
      tags: [demo]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: asset, in: query, schema: { type: string, enum: [all, USDC, BETTEX], default: all } }
        - { name: account, in: query, schema: { type: string, enum: [all, treasury, buyback], default: all } }
        - { name: wallet, in: query, schema: { type: string, enum: [all, operational, reserve, crypto_agent, buyback], default: all } }
        - { name: category, in: query, schema: { type: string, default: all, maxLength: 40 } }
        - { name: direction, in: query, schema: { type: string, enum: [all, in, out], default: all } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: asOf, in: query, schema: { type: string, format: date-time } }
        - { name: snapshot, in: query, schema: { type: string, pattern: '^\d{1,20}$' } }
        - { name: locale, in: query, schema: { type: string, enum: [pt, en, es], default: en } }
      responses:
        "200":
          description: Complete filtered statement export, not just the visible page.
          content:
            text/csv:
              schema: { type: string }
        "400": { description: Invalid filters }
        "503": { description: Statement unavailable }
  /demo/treasury/activity:
    get:
      operationId: getDemoTreasuryActivity
      tags: [demo]
      parameters:
        - { name: roundId, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { name: view, in: query, schema: { type: string, enum: [closed, fees, history], default: history } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100000, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: snapshot, in: query, schema: { type: string, pattern: '^\d+$', maxLength: 20 } }
      responses:
        "200":
          description: Paginated persisted emulated treasury activity, never native wallet transactions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoTreasuryActivityPage" }
        "400": { description: Invalid pagination or round }
        "503": { description: Ledger unavailable }
  /history/transparency:
    get:
      operationId: getHistoryTransparency
      responses:
        "200":
          description: Aggregated capital from confirmed treasury receipts, excluding reversals and internal transfers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HistoryAggregate" }
  /account/history:
    get:
      operationId: getTestHistory
      parameters: &historyParameters
        - { name: view, in: query, schema: { type: string, enum: [general, swapping, staking, distributions, activity, treasury] } }
        - { name: environment, in: query, schema: { type: string, enum: [account_test, local_evm, simulation, testnet, production] } }
        - { name: category, in: query, schema: { type: string, enum: [financial, activity, automatic] } }
        - { name: state, in: query, schema: { type: string, maxLength: 40 } }
        - { name: asset, in: query, schema: { type: string, enum: [USDC, BETTEX, ETH] } }
        - { name: chainId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: wallet, in: query, schema: { type: string, maxLength: 100 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: kind, in: query, schema: { type: string, maxLength: 60 } }
        - { name: correlationId, in: query, schema: { type: string, maxLength: 256 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 2000 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses: &historyResponses
        "200":
          description: Authorized paginated shared journal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryPage" }
        "400": { description: Invalid filters or cursor }
        "401": { description: Session required }
        "403": { description: Permission required }
  /demo/rounds:
    parameters:
      - $ref: "#/components/parameters/DemoTabSession"
    get:
      operationId: getDemoRoundArchive
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
        - { name: round, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Persisted closed rounds, newest first, with account-scoped participation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoRoundArchivePage" }
        "400": { description: Invalid pagination }
  /demo/history:
    parameters:
      - $ref: "#/components/parameters/DemoTabSession"
    get:
      operationId: getDemoHistory
      parameters: *historyParameters
      responses: *historyResponses
  /account/history/admin:
    get:
      operationId: getTreasuryHistory
      parameters: *historyParameters
      responses: *historyResponses
  /demo/history/distribution-preview:
    parameters:
      - $ref: "#/components/parameters/DemoTabSession"
    post:
      operationId: previewHistoryDistribution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HistoryDistributionInput"
      responses:
        "200": { description: Simulation calculation recorded without payout or new rights }
        "403": { description: Development simulation only }
  /test-contract:
    get:
      operationId: getTestContract
      tags: [test-contract]
      responses:
        "200":
          description: Blockchain-verified test contract state or explicit missing configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestContractState"
        "401":
          description: Existing application login required
        "503":
          description: Blockchain could not be verified
    post:
      operationId: observeTestContract
      tags: [test-contract]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestContractInput"
      responses:
        "200":
          description: Validated contract linked to this existing account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestContractState"
        "400":
          description: Invalid address or source mismatch
        "401":
          description: Existing application login required
        "503":
          description: Blockchain could not be verified
  /account/session:
    get:
      operationId: getTestAccountSession
      tags: [test-account]
      responses:
        "200":
          description: Test-only account and encrypted personal vault
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestAccountSnapshot"
  /account/commands:
    post:
      operationId: testAccountCommand
      tags: [test-account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestAccountCommand"
      responses:
        "200":
          description: Updated account, no plaintext keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestAccountSnapshot"
        "400":
          description: Invalid input
        "401":
          description: Invalid credentials
        "403":
          description: Test environment or session not authorized
        "409":
          description: Duplicate email or stale vault revision
        "429":
          description: Attempt limit exceeded
  /demo/testnet:
    get:
      operationId: getDemoTestnet
      tags: [demo]
      summary: Verified public-testnet demo activity registry; not financial settlement
      responses:
        "200":
          description: Public RPC and registry verification, including unavailable states
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoTestnet"
  /demo/testnet-activity:
    get:
      operationId: getDemoTestnetActivity
      tags: [demo]
      summary: Anonymous aggregate demo activity without identities, balances or capabilities
      responses:
        "200":
          description: Non-personal aggregate observations for testnet checkpoints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoTestnetActivity"
  /demo/dashboard:
    parameters:
      - $ref: "#/components/parameters/DemoTabSession"
    get:
      operationId: getDemoDashboard
      tags: [demo]
      summary: Tab-scoped demo dashboard and live agent activity
      responses:
        "200":
          description: Current dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoDashboard"
  /demo/double2x:
    get:
      operationId: getDemoDouble2x
      tags: [demo]
      parameters:
        - $ref: "#/components/parameters/DemoTabSession"
      responses:
        "200":
          description: Isolated public-testnet game and persistent history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoDouble2x" }
    post:
      operationId: playDemoDouble2x
      tags: [demo]
      parameters:
        - $ref: "#/components/parameters/DemoTabSession"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Double2xPlayInput" }
      responses:
        "200":
          description: Persisted reservation; polling observes public settlement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoDouble2x" }
  /demo/lottery/participation:
    parameters:
      - $ref: "#/components/parameters/DemoTabSession"
    post:
      operationId: updateDemoLotteryParticipation
      tags: [demo]
      summary: Confirm optional daily modeled burn lottery participation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DemoLotteryParticipation" }
      responses:
        "200":
          description: Updated dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoDashboard" }
  /demo/lottery/entries:
    parameters:
      - $ref: "#/components/parameters/DemoTabSession"
    post:
      operationId: buyDemoLotteryEntries
      tags: [demo]
      summary: Buy modeled lottery numbers at 1 USDC each and burn the acquired BETTEX
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DemoLotteryEntryOrder" }
      responses:
        "200":
          description: Dashboard with generated entries and the recorded simulated burn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoDashboard" }
  /demo/movements:
    parameters:
      - $ref: "#/components/parameters/DemoTabSession"
    post:
      operationId: createDemoMovement
      tags: [demo]
      summary: Submit a fictitious personal movement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoMovementInput"
      responses:
        "200":
          description: Updated dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoDashboard"
        "400":
          description: Invalid amount or insufficient balance
  /demo/swap-quote:
    parameters:
      - $ref: "#/components/parameters/DemoTabSession"
    get:
      operationId: getDemoSwapQuote
      tags: [demo]
      summary: Quote a simulated constant-product BETTEX/USDC swap
      parameters:
        - { name: asset, in: query, required: true, schema: { type: string, enum: [USDC, BETTEX] } }
        - { name: amount, in: query, required: true, schema: { type: number, minimum: 0.000001, maximum: 100000 } }
      responses:
        "200":
          description: Executable estimate from the current simulated pool reserves
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoSwapQuote" }
        "400":
          description: Invalid amount, unavailable liquidity or proceeds below the service fee
  /demo/profile:
    parameters:
      - $ref: "#/components/parameters/DemoTabSession"
    patch:
      operationId: updateDemoProfile
      tags: [demo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoProfileInput"
      responses:
        "200":
          description: Updated dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoDashboard"
  /demo/profile/avatar/upload-url:
    parameters:
      - $ref: "#/components/parameters/DemoTabSession"
    post:
      operationId: requestDemoProfileAvatar
      tags: [demo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileAvatarUploadInput"
      responses:
        "200":
          description: Scoped profile-picture upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileAvatarUpload"
  /profile-pictures/{id}:
    get:
      operationId: getProfilePicture
      tags: [demo]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Validated profile picture
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /account/execution:
    get:
      operationId: getNativeTestJourney
      responses:
        "200":
          description: Confirmed development-chain data for the authenticated personal wallets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NativeTestJourney" }
    post:
      operationId: nativeTestJourneyCommand
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NativeTestJourneyCommand" }
      responses:
        "200":
          description: Persisted operation state, not necessarily confirmation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NativeTestJourney" }
components:
  parameters:
    DemoTabSession:
      in: header
      name: X-Bettex-Demo-Session

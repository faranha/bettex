name: Development quality
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bettex_ci
          POSTGRES_USER: bettex_ci
          # Ephemeral fixture credential, not shared with any real environment.
          POSTGRES_PASSWORD: isolated-github-actions-fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bettex_ci -d bettex_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://bettex_ci@localhost:5432/bettex_ci
      PGPASSWORD: isolated-github-actions-fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.26.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PostgreSQL fixture backup tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: pnpm quality
      - name: Generated contracts must be committed
        run: git diff --exit-code -- lib/api-client-react/src/generated lib/api-zod/src/generated